<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        /* 第一阶段：倒计时和粒子祝福 */
        #stage1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #stage1.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .blessing-text {
            position: relative;
            z-index: 10;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 105, 180, 0.4);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        .blessing-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .countdown {
            position: relative;
            z-index: 10;
            font-size: 8rem;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.8), 0 0 60px rgba(255, 107, 157, 0.4);
            margin-top: 40px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease;
        }

        .countdown.show {
            opacity: 1;
            transform: scale(1);
        }

        /* 第二阶段：生日蛋糕 */
        #stage2 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a1a2e 50%, #0f0f23 100%);
        }

        #stage2.show {
            opacity: 1;
            pointer-events: auto;
        }

        .cake-title {
            font-size: 3rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.8s ease;
        }

        .cake-title.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cake-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
        }

        .cake-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cake-layer {
            width: 250px;
            height: 80px;
            background: linear-gradient(to bottom, #f4a460 0%, #deb887 50%, #d2691e 100%);
            border-radius: 10px 10px 5px 5px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .cake-layer.top {
            width: 200px;
            height: 70px;
            background: linear-gradient(to bottom, #ffb6c1 0%, #ff69b4 50%, #ff1493 100%);
            border-radius: 20px 20px 5px 5px;
            margin-bottom: -10px;
            z-index: 2;
        }

        .cream {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cream.top-cream {
            width: 180px;
            top: -12px;
        }

        .candle {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 40px;
            background: linear-gradient(to right, #ff6b6b, #ff8e8e, #ff6b6b);
            border-radius: 3px;
            z-index: 3;
        }

        .candle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
        }

        .wick {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: #333;
            border-radius: 1px;
        }

        .flame {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 35px;
            background: radial-gradient(ellipse at bottom, #ff6b00 0%, #ff9500 30%, #ffcc00 60%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.3s infinite alternate;
            filter: blur(1px);
            z-index: 4;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.1) rotate(1deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(0.95) rotate(-1deg); opacity: 1; }
        }

        .decorations {
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
        }

        .decoration {
            width: 15px;
            height: 15px;
            background: #ff6b9d;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .decoration:nth-child(2) { background: #ffd93d; }
        .decoration:nth-child(3) { background: #6bcb77; }
        .decoration:nth-child(4) { background: #4d96ff; }
        .decoration:nth-child(5) { background: #ff6b9d; }

        .plate {
            width: 300px;
            height: 20px;
            background: linear-gradient(to bottom, #e0e0e0, #b0b0b0);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .blow-hint {
            margin-top: 30px;
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
            cursor: pointer;
            padding: 15px 30px;
            border: 2px solid #ffd700;
            border-radius: 30px;
            animation: pulse 2s infinite;
        }

        .blow-hint.show {
            opacity: 1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .smoke {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(200, 200, 200, 0.6);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        /* 第三阶段：信封轮播 */
        #stage3 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a57 50%, #3d2c5e 100%);
            overflow: hidden;
        }

        #stage3.show {
            opacity: 1;
            pointer-events: auto;
        }

        .envelope-title {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 30px;
            z-index: 10;
        }

        .envelope-carousel {
            position: relative;
            width: 350px;
            height: 250px;
            perspective: 1000px;
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe4c4 100%);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            clip-path: polygon(0 0, 50% 60%, 100% 0);
            border-radius: 10px 10px 0 0;
        }

        .envelope h3 {
            font-size: 1.8rem;
            color: #d63384;
            margin-bottom: 15px;
            z-index: 1;
        }

        .envelope p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
            z-index: 1;
        }

        .envelope.current {
            transform: translateY(0) scale(1);
            opacity: 1;
            z-index: 3;
        }

        .envelope.next {
            transform: translateY(100px) scale(0.8);
            opacity: 0.6;
            z-index: 2;
        }

        .envelope.prev {
            transform: translateY(-100px) scale(0.8);
            opacity: 0.6;
            z-index: 2;
        }

        .envelope.hidden-down {
            transform: translateY(200px) scale(0.6);
            opacity: 0;
            z-index: 1;
        }

        .envelope.hidden-up {
            transform: translateY(-200px) scale(0.6);
            opacity: 0;
            z-index: 1;
        }

        .carousel-hint {
            margin-top: 40px;
            color: #aaa;
            font-size: 1rem;
            z-index: 10;
        }

        .continue-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8e53 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .continue-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.6);
        }

        /* 第四阶段：烟花特效 */
        #stage4 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 70;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }

        #stage4.show {
            opacity: 1;
            pointer-events: auto;
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        .final-message h1 {
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 107, 157, 0.6);
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s ease;
        }

        .final-message h1.show {
            opacity: 1;
            transform: scale(1);
        }

        .final-message p {
            font-size: 1.8rem;
            color: #ff6b9d;
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.6);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease 0.5s;
        }

        .final-message p.show {
            opacity: 1;
            transform: translateY(0);
        }

        .replay-btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffd700 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease 1s;
        }

        .replay-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .replay-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .blessing-text { font-size: 2rem; }
            .countdown { font-size: 5rem; }
            .cake-title { font-size: 2rem; }
            .final-message h1 { font-size: 2.5rem; }
            .final-message p { font-size: 1.3rem; }
            .envelope-carousel { width: 300px; height: 220px; }
        }
    </style>
</head>
<body>
    <!-- 第一阶段：粒子祝福和倒计时 -->
    <div id="stage1">
        <canvas id="particles-canvas"></canvas>
        <div class="blessing-text" id="blessing-text"></div>
        <div class="countdown" id="countdown"></div>
    </div>

    <!-- 第二阶段：生日蛋糕 -->
    <div id="stage2">
        <h2 class="cake-title" id="cake-title">🎂 生日快乐 🎂</h2>
        <div class="cake-container" id="cake-container">
            <div class="cake-layer top">
                <div class="cream top-cream"></div>
                <div class="candle">
                    <div class="wick"></div>
                </div>
                <div class="flame" id="flame"></div>
                <div class="decorations">
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                </div>
            </div>
            <div class="cake-layer">
                <div class="cream"></div>
                <div class="decorations">
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                    <div class="decoration"></div>
                </div>
            </div>
            <div class="plate"></div>
        </div>
        <div class="blow-hint" id="blow-hint">👆 点击吹灭蜡烛</div>
    </div>

    <!-- 第三阶段：信封轮播 -->
    <div id="stage3">
        <h2 class="envelope-title">💌 给你的祝福 💌</h2>
        <div class="envelope-carousel" id="envelope-carousel">
            <div class="envelope" data-index="0">
                <h3>🌟 愿你</h3>
                <p>每一天都充满阳光和欢笑<br>所有的愿望都能实现</p>
            </div>
            <div class="envelope" data-index="1">
                <h3>🎁 祝你</h3>
                <p>前程似锦，未来可期<br>勇敢追逐自己的梦想</p>
            </div>
            <div class="envelope" data-index="2">
                <h3>💖 希望你</h3>
                <p>被世界温柔以待<br>永远保持热爱与赤诚</p>
            </div>
            <div class="envelope" data-index="3">
                <h3>🎉 祝福你</h3>
                <p>生日快乐，岁岁平安<br>新的一岁更加精彩</p>
            </div>
        </div>
        <p class="carousel-hint">点击信封向下翻阅 ↓</p>
        <button class="continue-btn" id="continue-btn">继续惊喜 ✨</button>
    </div>

    <!-- 第四阶段：烟花特效 -->
    <div id="stage4">
        <canvas id="fireworks-canvas"></canvas>
        <div class="final-message">
            <h1 id="happy-birthday">生日快乐！</h1>
            <p id="wish-you">愿你拥有最美好的一天 🎉</p>
            <button class="replay-btn" id="replay-btn">再看一次 🔄</button>
        </div>
    </div>

    <script>
        // 祝福语数组
        const blessings = [
            "✨ 生日快乐 ✨",
            "🎂 愿你梦想成真 🎂",
            "🌟 天天开心 🌟",
            "💖 幸福美满 💖",
            "🎉 心想事成 🎉"
        ];

        // 状态管理
        let currentStage = 1;
        let currentBlessing = 0;
        let currentEnvelope = 0;
        let envelopeViewed = new Set();

        // 第一阶段：粒子效果
        const particlesCanvas = document.getElementById('particles-canvas');
        const pCtx = particlesCanvas.getContext('2d');
        let particles = [];

        function resizeParticlesCanvas() {
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
        }
        resizeParticlesCanvas();
        window.addEventListener('resize', resizeParticlesCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * particlesCanvas.width;
                this.y = Math.random() * particlesCanvas.height;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                this.opacity = Math.random() * 0.5 + 0.5;
                const colors = ['#ff6b9d', '#ffd700', '#6bcb77', '#4d96ff', '#ff8e53'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;

                if (this.life <= 0 || this.x < 0 || this.x > particlesCanvas.width ||
                    this.y < 0 || this.y > particlesCanvas.height) {
                    this.reset();
                }

                this.opacity = (this.life / this.maxLife) * 0.8;
            }

            draw() {
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                pCtx.fillStyle = this.color.replace(')', `, ${this.opacity})`).replace('rgb', 'rgba');
                pCtx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            if (currentStage > 1) return;
            pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 绘制连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        pCtx.beginPath();
                        pCtx.strokeStyle = `rgba(255, 107, 157, ${0.2 * (1 - distance / 100)})`;
                        pCtx.lineWidth = 1;
                        pCtx.moveTo(particles[i].x, particles[i].y);
                        pCtx.lineTo(particles[j].x, particles[j].y);
                        pCtx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }

        // 播放祝福语
        function showBlessing() {
            const textEl = document.getElementById('blessing-text');
            textEl.textContent = blessings[currentBlessing];
            textEl.classList.add('show');

            setTimeout(() => {
                textEl.classList.remove('show');
                currentBlessing = (currentBlessing + 1) % blessings.length;

                if (currentBlessing === 0) {
                    setTimeout(startCountdown, 500);
                } else {
                    setTimeout(showBlessing, 1500);
                }
            }, 2000);
        }

        // 倒计时
        function startCountdown() {
            const countdownEl = document.getElementById('countdown');
            let count = 5;

            countdownEl.textContent = count;
            countdownEl.classList.add('show');

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                    countdownEl.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        countdownEl.style.transform = 'scale(1)';
                    }, 100);
                } else {
                    clearInterval(countInterval);
                    countdownEl.textContent = '🎂';
                    setTimeout(showStage2, 1000);
                }
            }, 1000);
        }

        // 显示第二阶段
        function showStage2() {
            currentStage = 2;
            document.getElementById('stage1').classList.add('hidden');

            const stage2 = document.getElementById('stage2');
            stage2.classList.add('show');

            setTimeout(() => {
                document.getElementById('cake-title').classList.add('show');
            }, 500);

            setTimeout(() => {
                document.getElementById('cake-container').classList.add('show');
            }, 1000);

            setTimeout(() => {
                document.getElementById('blow-hint').classList.add('show');
            }, 1800);
        }

        // 吹灭蜡烛
        document.getElementById('blow-hint').addEventListener('click', blowCandle);
        document.getElementById('flame').addEventListener('click', blowCandle);

        function blowCandle() {
            const flame = document.getElementById('flame');
            const blowHint = document.getElementById('blow-hint');

            // 生成烟雾效果
            createSmoke();

            flame.style.transition = 'all 0.5s ease';
            flame.style.opacity = '0';
            flame.style.transform = 'translateX(-50%) scale(0)';

            blowHint.textContent = '✨ 愿望成真 ✨';

            setTimeout(showStage3, 2000);
        }

        function createSmoke() {
            const cakeContainer = document.getElementById('cake-container');
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke';
                    smoke.style.left = `${140 + Math.random() * 20}px`;
                    smoke.style.top = '-40px';
                    cakeContainer.appendChild(smoke);

                    smoke.style.opacity = '1';
                    smoke.style.transition = 'all 2s ease-out';

                    setTimeout(() => {
                        smoke.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -100px)`;
                        smoke.style.opacity = '0';
                        smoke.style.width = '30px';
                        smoke.style.height = '30px';
                    }, 50);

                    setTimeout(() => smoke.remove(), 2500);
                }, i * 100);
            }
        }

        // 显示第三阶段
        function showStage3() {
            currentStage = 3;
            document.getElementById('stage2').classList.remove('show');

            const stage3 = document.getElementById('stage3');
            stage3.classList.add('show');

            updateEnvelopes();
        }

        // 更新信封位置
        function updateEnvelopes() {
            const envelopes = document.querySelectorAll('.envelope');
            envelopes.forEach((env, idx) => {
                env.classList.remove('current', 'next', 'prev', 'hidden-down', 'hidden-up');

                const diff = idx - currentEnvelope;
                if (diff === 0) {
                    env.classList.add('current');
                } else if (diff === 1 || (currentEnvelope === envelopes.length - 1 && idx === 0)) {
                    env.classList.add('next');
                } else if (diff === -1 || (currentEnvelope === 0 && idx === envelopes.length - 1)) {
                    env.classList.add('prev');
                } else if (diff > 0) {
                    env.classList.add('hidden-down');
                } else {
                    env.classList.add('hidden-up');
                }
            });

            envelopeViewed.add(currentEnvelope);

            if (envelopeViewed.size >= envelopes.length) {
                document.getElementById('continue-btn').classList.add('show');
            }
        }

        // 点击信封切换
        document.getElementById('envelope-carousel').addEventListener('click', () => {
            const envelopes = document.querySelectorAll('.envelope');
            currentEnvelope = (currentEnvelope + 1) % envelopes.length;
            updateEnvelopes();
        });

        // 继续按钮
        document.getElementById('continue-btn').addEventListener('click', showStage4);

        // 显示第四阶段
        function showStage4() {
            currentStage = 4;
            document.getElementById('stage3').classList.remove('show');

            const stage4 = document.getElementById('stage4');
            stage4.classList.add('show');

            startFireworks();

            setTimeout(() => {
                document.getElementById('happy-birthday').classList.add('show');
            }, 500);

            setTimeout(() => {
                document.getElementById('wish-you').classList.add('show');
            }, 1200);

            setTimeout(() => {
                document.getElementById('replay-btn').classList.add('show');
            }, 2000);
        }

        // 烟花效果
        const fireworksCanvas = document.getElementById('fireworks-canvas');
        const fCtx = fireworksCanvas.getContext('2d');
        let fireworks = [];
        let particlesFirework = [];
        let animationId;

        function resizeFireworksCanvas() {
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }
        resizeFireworksCanvas();
        window.addEventListener('resize', resizeFireworksCanvas);

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = fireworksCanvas.height;
                this.targetY = y;
                this.speed = 8;
                this.angle = Math.atan2(y - this.y, x - this.x);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.brightness = Math.random() * 50 + 50;
                const colors = ['#ff6b9d', '#ffd700', '#6bcb77', '#4d96ff', '#ff8e53', '#ff6b6b', '#a855f7'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.trail = [];
                this.trailLength = 3;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.x += this.vx;
                this.y += this.vy;

                const distance = Math.sqrt(Math.pow(this.x - (fireworksCanvas.width / 2), 2) + Math.pow(this.y - this.targetY, 2));
                return distance < 10 || this.y <= this.targetY;
            }

            draw() {
                this.trail.forEach((point, idx) => {
                    fCtx.beginPath();
                    fCtx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                    fCtx.fillStyle = this.color;
                    fCtx.globalAlpha = idx / this.trailLength;
                    fCtx.fill();
                });

                fCtx.globalAlpha = 1;
                fCtx.beginPath();
                fCtx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                fCtx.fillStyle = this.color;
                fCtx.fill();
            }

            explode() {
                const particleCount = 80;
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 / particleCount) * i;
                    const speed = Math.random() * 5 + 2;
                    particlesFirework.push(new ParticleFirework(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, this.color));
                }
            }
        }

        class ParticleFirework {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.005;
                this.gravity = 0.05;
            }

            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha <= 0;
            }

            draw() {
                fCtx.globalAlpha = this.alpha;
                fCtx.beginPath();
                fCtx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                fCtx.fillStyle = this.color;
                fCtx.fill();
            }
        }

        function startFireworks() {
            fireworks = [];
            particlesFirework = [];

            function animateFireworks() {
                if (currentStage !== 4) return;

                animationId = requestAnimationFrame(animateFireworks);
                fCtx.globalAlpha = 0.1;
                fCtx.fillStyle = '#0f0f23';
                fCtx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
                fCtx.globalAlpha = 1;

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    fireworks[i].draw();
                    if (fireworks[i].update()) {
                        fireworks[i].explode();
                        fireworks.splice(i, 1);
                    }
                }

                for (let i = particlesFirework.length - 1; i >= 0; i--) {
                    particlesFirework[i].draw();
                    if (particlesFirework[i].update()) {
                        particlesFirework.splice(i, 1);
                    }
                }
            }

            animateFireworks();

            function launchFirework() {
                if (currentStage !== 4) return;
                const x = Math.random() * fireworksCanvas.width * 0.6 + fireworksCanvas.width * 0.2;
                const y = Math.random() * fireworksCanvas.height * 0.4 + fireworksCanvas.height * 0.1;
                fireworks.push(new Firework(x, y));
                setTimeout(launchFirework, Math.random() * 1000 + 500);
            }

            setTimeout(launchFirework, 500);
        }

        // 重放按钮
        document.getElementById('replay-btn').addEventListener('click', resetAndReplay);

        function resetAndReplay() {
            currentStage = 1;
            currentBlessing = 0;
            currentEnvelope = 0;
            envelopeViewed.clear();

            cancelAnimationFrame(animationId);

            document.getElementById('stage4').classList.remove('show');
            document.getElementById('stage3').classList.remove('show');
            document.getElementById('stage2').classList.remove('show');
            document.getElementById('stage1').classList.remove('hidden');

            document.getElementById('cake-title').classList.remove('show');
            document.getElementById('cake-container').classList.remove('show');
            document.getElementById('blow-hint').classList.remove('show');
            document.getElementById('happy-birthday').classList.remove('show');
            document.getElementById('wish-you').classList.remove('show');
            document.getElementById('replay-btn').classList.remove('show');
            document.getElementById('continue-btn').classList.remove('show');

            const flame = document.getElementById('flame');
            flame.style.transition = '';
            flame.style.opacity = '1';
            flame.style.transform = 'translateX(-50%)';

            document.getElementById('blow-hint').textContent = '👆 点击吹灭蜡烛';

            setTimeout(() => {
                animateParticles();
                showBlessing();
            }, 500);
        }

        window.addEventListener('load', () => {
            animateParticles();
            showBlessing();
        });
    </script>
</body>
</html>
